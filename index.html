<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anaes Kit</title>
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anaes Kit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f5f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e0db; --line-2:#d3d1cb;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#7a7974;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --crit:#d03b3b; --crit-soft:#fbeaea; --good:#0a7d0a; --good-soft:#e5f4e5; --warn-soft:#fdf3dc; --warn-ink:#7a5200;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --tabh:64px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-2:#3a3a36;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b2a3d;
    --crit:#e66767; --crit-soft:#3a1f1f; --good:#4cc24c; --good-soft:#1c2e1c; --warn-soft:#33290f; --warn-ink:#f2c35a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tab-num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.topnav{display:none;gap:4px;margin-left:24px}
.topnav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
.topnav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.sync-pill{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--good)} .dot.err{background:var(--crit)} .dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--accent)}
@media (min-width:900px){
  .topnav{display:flex} .tabbar{display:none}
  main{padding-bottom:40px}
}

/* ---------- generic ---------- */
h1{font-size:24px;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn-ink)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px;outline:none;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);background:var(--surface)}
.checks input{display:none}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn-ink);display:flex;gap:8px;align-items:flex-start}
.notice.info{background:var(--accent-soft);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}

/* ---------- drugs ---------- */
.pt-bar{padding:12px 14px;margin-bottom:12px}
.pt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt-grid input,.pt-grid select{min-height:38px;padding:6px 9px}
.pt-derived{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{padding-left:38px;min-height:46px;font-size:16px;border-radius:12px}
.searchbox svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--ink-3)}
.drug-layout{display:block}
.drug-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.drug-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;text-decoration:none;color:inherit}
.drug-item:hover{border-color:var(--line-2)}
.drug-item.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.drug-item .nm{font-weight:650}
.drug-item .cl{font-size:12.5px;color:var(--ink-3)}
.drug-item .chev{margin-left:auto;color:var(--ink-3)}
@media (min-width:900px){
  .drug-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  .drug-side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
  .drug-detail-wrap{min-height:60vh}
  .back-link{display:none!important}
}
@media (max-width:899px){
  .drug-layout.detail-open .drug-side{display:none}
  .drug-layout:not(.detail-open) .drug-detail-wrap{display:none}
}
.dd-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dd-title{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:0}
.dd-aka{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.dose-line{padding:10px 0;border-top:1px solid var(--line)}
.dose-line:first-child{border-top:0}
.dose-ind{font-weight:650;font-size:14px}
.dose-txt{color:var(--ink-2);font-size:14px;margin-top:1px}
.calc{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.calc .res{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
.calc .vol{background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.calc .wnote{font-size:12px;color:var(--ink-3)}
.calc .icin{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3)}
.calc .icin input{width:78px;min-height:28px;padding:2px 6px;font-size:13px;border-radius:6px}
.dose-line.max .dose-ind{color:var(--crit)}
.dose-line.max .calc .res{background:var(--crit-soft);color:var(--crit)}
.maxbox{border:1px solid color-mix(in srgb,var(--crit) 45%,var(--line));background:var(--crit-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.maxbox b{color:var(--crit)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.tile .v{font-weight:650;margin-top:2px;font-size:14px}
.prose{font-size:14.5px;color:var(--ink)}
.sec{margin-top:14px}
.verify-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* ---------- log ---------- */
.log-month{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin:18px 2px 8px}
.entry{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:flex-start;margin-bottom:6px}
.entry:hover{border-color:var(--line-2)}
.entry .cat-bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.entry .e-main{flex:1;min-width:0}
.entry .e-title{font-weight:650}
.entry .e-sub{font-size:13px;color:var(--ink-2);margin-top:1px}
.entry .e-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.entry .e-date{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);z-index:25;border-radius:999px;min-height:52px;padding:0 20px;font-size:15px;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
@media (min-width:900px){.fab{position:static;box-shadow:none}}

/* ---------- sheet (modal) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{margin:0}
.sheet-body{overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.fs{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface)}
.fs-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:10px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.dash-grid{display:grid;gap:14px}
@media (min-width:900px){.dash-grid{grid-template-columns:1fr 1fr}.dash-grid .wide{grid-column:1/-1}}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.hbar .track{height:14px;position:relative}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hbar .cnt{font-variant-numeric:tabular-nums;font-weight:650;min-width:2ch;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12.5px;color:var(--ink-2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-wrap .grid line{stroke:var(--line);stroke-width:1}
.chart-wrap .axis text{fill:var(--ink-3);font-size:11px;font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:140px;z-index:5}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
table.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink-3);font-weight:700;font-size:12px}
.tbl-scroll{overflow-x:auto}

/* ---------- settings ---------- */
.set-sec{margin-bottom:14px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
ol.steps{padding-left:20px;margin:6px 0;font-size:14px}
ol.steps li{margin-bottom:6px}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">A</span>Anaes Kit</div>
    <nav class="topnav">
      <a href="#drugs" data-v="drugs">Drugs</a><a href="#log" data-v="log">Log</a><a href="#dash" data-v="dash">Dashboard</a><a href="#settings" data-v="settings">Settings</a>
    </nav>
    <button class="sync-pill" id="syncpill" aria-label="Sync status"><span class="dot"></span>Local only</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <a href="#drugs" data-v="drugs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>Drugs</a>
    <a href="#log" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Log</a>
    <a href="#dash" data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dashboard</a>
    <a href="#settings" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>Settings</a>
  </nav>
</div>
<script>
/* Anaesthesia drug reference — data file.
   DRAFT REFERENCE: every entry ships as UNVERIFIED. Check each against your local
   formulary / product information before relying on it, then mark it verified in-app.
   Schema:
   id,n(name),a(aka),c(class),conc(presentation text),
   cc:[{l,v,u}] concentrations for mL calc (v per mL in mg, or units if u:'units'),
   d / p: adult / paeds dose lines {i:indication,t:text,k:calc}

<script>
/* Anaes Kit — offline drug reference + procedure log. Vanilla JS, no dependencies. */
(function(){
'use strict';

const DRUGS = window.DRUGS || [];
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

/* ---------------- storage ---------------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('ak.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ak.'+k, JSON.stringify(v)); }catch(e){ toast('Storage full or blocked — export a backup'); } }
};
const S = {
  entries: LS.get('entries', []),        // procedure log records
  drugmeta: LS.get('drugmeta', {}),      // {drugId:{verified:'YYYY-MM-DD'|null, note:'', updatedAt}}
  patient: LS.get('patient', {wt:'',ht:'',age:'',sex:''}),
  settings: LS.get('settings', {owner:'',repo:'',token:'',path:'anaes-kit-data.json',auto:true}),
  sync: LS.get('sync', {lastSync:null, status:'off', msg:''}),
  ui: {drugQ:'', drugCls:'All', logCat:'All', logQ:'', dashRange:'12m', dashCat:null, showTable:false}
};
function saveEntries(){ LS.set('entries', S.entries); scheduleSync(); }
function saveMeta(){ LS.set('drugmeta', S.drugmeta); scheduleSync(); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---------------- procedure taxonomy ---------------- */
const CATS = [
  {id:'airway', name:'Airway', color:'var(--s1)'},
  {id:'neuraxial', name:'Neuraxial', color:'var(--s2)'},
  {id:'block', name:'Nerve block', color:'var(--s3)'},

];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const PROCS = {
  airway:['ETT – oral','ETT – nasal','SGA / LMA','Double-lumen tube','Bronchial blocker','Awake tracheal intubation','Asleep fibreoptic intubation','Front-of-neck access','Mask ventilation only','Tube exchange'],
  neuraxial:['Spinal','Epidural – lumbar','Epidural – thoracic','Epidural – labour','CSE','Caudal','Epidural blood patch','Lumbar drain'],
  block:['Interscalene','Supraclavicular','Infraclavicular','Axillary','Superficial cervical plexus','Deep cervical plexus','Suprascapular','Wrist / forearm','Femoral','Fascia iliaca','PENG','Lateral femoral cutaneous','Adductor canal','iPACK','Popliteal sciatic','Subgluteal / transgluteal sciatic','Lumbar plexus','Obturator','Ankle','TAP','Rectus sheath','Quadratus lumborum','ESP','Paravertebral','PECS I / II','Serratus anterior','Parasternal / PIFB','Intercostal','Ilioinguinal / iliohypogastric','Scalp block','Peribulbar / sub-Tenon','Bier\'s block (IVRA)','Other block'],

  case:['General anaesthetic','GA + regional','Neuraxial anaesthetic','Regional anaesthetic (sole)','Sedation / MAC'],
  other:['Gastric ultrasound','FoCUS / cardiac POCUS','Lung ultrasound','TOE','NG / OG tube','Chest drain','Lumbar puncture','Other']
};
const SITES = {

/* ---------------- patient & weight scalars ---------------- */
function scalars(){
  const p = S.patient, W = parseFloat(p.wt), H = parseFloat(p.ht);
  if(!(W>0)) return null;
  const out = {TBW:W, IBW:null, LBW:null, ABW:null, BMI:null};
  if(H>0){
    out.BMI = W/Math.pow(H/100,2);
    if(p.sex==='M'||p.sex==='F'){
      let ibw = (p.sex==='F'?45.5:50) + 0.91*(H-152.4);
      if(ibw>0){ out.IBW = Math.min(ibw, W); out.ABW = out.IBW + 0.4*(W-out.IBW); }
      out.LBW = p.sex==='F' ? 9270*W/(8780+244*out.BMI) : 9270*W/(6680+216*out.BMI);
    }
  }
  return out;
}
const fmt = n => {
  if(n==null||!isFinite(n)) return '–';
  const a = Math.abs(n);
  let s;
  if(a>=100) s = Math.round(n).toString();
  else if(a>=10) s = (Math.round(n*10)/10).toString();
  else if(a>=1) s = (Math.round(n*100)/100).toString();
  else if(a===0) s='0';
  else s = Number(n.toPrecision(2)).toString();
  return s;
};
const rng = (a,b,u) => (Math.abs(a-b) < 1e-9 ? fmt(a) : fmt(a)+'–'+fmt(b)) + (u?' '+u:'');
function amtStr(lo,hi,base){
  if(base==='mcg' && hi>=1000) return rng(lo/1000,hi/1000,'mg');
  if(base==='mg' && hi<1 && hi>0) return rng(lo*1000,hi*1000,'mcg');
  return rng(lo,hi,base);
}

/* calc line -> html (needs scalars) */
function calcHtml(k, sc, drug, lineKey, paeds){
  if(!k) return '';
  const parts = k.u.split('/');
  const base = parts[0];
  const perKg = parts.includes('kg');
  const time = parts.find(x=>x==='min'||x==='h'||x==='day');
  if(perKg && !sc) return '<div class="calc"><span class="wnote">Enter weight to calculate</span></div>';
  let scal = paeds ? 'TBW' : (k.s||'TBW');
  let w = perKg ? (sc[scal]!=null ? sc[scal] : sc.TBW) : 1;
  let fell = perKg && scal!=='TBW' && sc[scal]==null;
  let lo = k.v[0]*w, hi = k.v[1]*w, capped=false;
  if(k.cap!=null){ if(hi>k.cap){hi=k.cap;capped=true;} if(lo>k.cap) lo=k.cap; }
  const bits = [];
  if(!time){
    bits.push(`<span class="res">${amtStr(lo,hi,base)}</span>`);
    if(base==='mL'){ /* already a volume */ }
    else (drug.cc||[]).slice(0,3).forEach(c=>{
      const isUnits = c.u==='units';
      if(isUnits !== (base==='units')) return;
      const conv = base==='mcg'? 1/1000 : base==='g' ? 1000 : 1;
      const vlo = lo*conv/c.v, vhi = hi*conv/c.v;
      bits.push(`<span class="vol">${rng(vlo,vhi,'mL')} of ${esc(c.l)}</span>`);
    });
    if(drug.vial && base==='mg'){ bits.push(`<span class="vol">${Math.ceil(lo/drug.vial.mg)}${Math.ceil(hi/drug.vial.mg)!==Math.ceil(lo/drug.vial.mg)?'–'+Math.ceil(hi/drug.vial.mg):''} × ${esc(drug.vial.l)}</span>`); }
  } else if(time==='day'){
    bits.push(`<span class="res">${amtStr(lo,hi,base)}/day</span>`);
  } else {
    bits.push(`<span class="res">${amtStr(lo,hi,base)}/${time}</span>`);
    if(base==='mL'){
      if(time==='min') bits.push(`<span class="vol">${rng(lo*60,hi*60,'mL/h')}</span>`);
    } else if(k.ic){
      const key = drug.id+'|'+lineKey;
      const ic = S.icOverride && S.icOverride[key]!=null ? S.icOverride[key] : k.ic;
      const perH = time==='min'?60:1;
      bits.push(`<span class="vol">${rng(lo*perH/ic,hi*perH/ic,'mL/h')}</span>`);
      bits.push(`<span class="icin">@ <input type="number" step="any" inputmode="decimal" data-ic="${esc(key)}" value="${ic}"> ${esc(base)}/mL</span>`);
      if(k.icl) bits.push(`<span class="wnote">(default ${esc(k.icl)})</span>`);
    }
  }
  if(perKg) bits.push(`<span class="wnote">by ${scal}${fell?' → TBW (add height + sex)':''} ${fmt(w)} kg${capped?' · capped':''}</span>`);
  else if(capped) bits.push('<span class="wnote">capped</span>');
  return '<div class="calc">'+bits.join('')+'</div>';
}

const CLASSES = ['All', ...Array.from(new Set(DRUGS.map(d=>d.c)))];
const KW = {lipid:'last toxicity intralipid antidote', dantrolene:'mh malignant hyperthermia antidote', adrenaline:'anaphylaxis arrest epinephrine epi', sux:'scoline sch succinylcholine', naloxone:'opioid reversal narcan', flumazenil:'benzodiazepine reversal', sugammadex:'reversal roc', neostigmine:'reversal', methyleneblue:'methaemoglobinaemia methb', cacl:'hyperkalaemia hyperk calcium', cagluc:'hyperkalaemia hyperk calcium', insulin:'hyperkalaemia hyperk', bicarb:'tca acidosis', magnesium:'eclampsia pre-eclampsia torsades mgso4', oxytocin:'pph caesarean cs', carboprost:'pph hemabate', txa:'bleeding pph trauma', hydrocortisone:'adrenal crisis steroid', ondansetron:'ponv nausea', dexamethasone:'ponv steroid croup', lidocaine:'lignocaine xylocaine', gtn:'nitroglycerin uterine relaxation', cefazolin:'antibiotic prophylaxis', heparin:'ufh act', enoxaparin:'lmwh clexane', noradrenaline:'norepinephrine levophed pressor', phenylephrine:'spinal hypotension pressor', ephedrine:'pressor', metaraminol:'pressor'};
function searchDrugs(q, cls){
  q = q.trim().toLowerCase();
  let list = DRUGS.filter(d => cls==='All' || d.c===cls);
  if(!q) return list.slice().sort((a,b)=>a.n.localeCompare(b.n));
  const scored = [];
  for(const d of list){
    const n=d.n.toLowerCase(), a=(d.a||'').toLowerCase();
    let s=0;
    if(n.startsWith(q)) s=100; else if(n.includes(q)) s=80;
    else if(a.split(/[,;()]+/).some(x=>x.trim().startsWith(q))) s=70; else if(a.includes(q)) s=60;
    else if(KW[d.id] && KW[d.id].split(' ').some(w=>w.startsWith(q))) s=90;
    else if(d.c.toLowerCase().includes(q)) s=40;
    else { const hay=[d.ind,d.mx,d.nt,d.ph].join(' ').toLowerCase(); if(new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(hay)) s=30; else if(hay.includes(q)) s=20; }
    if(s) scored.push([s,d]);
  }
  return scored.sort((x,y)=>y[0]-x[0]||x[1].n.localeCompare(y[1].n)).map(x=>x[1]);
}

    const sb=ev.target.closest('.seg button'); if(sb){ const seg=sb.parentElement.dataset.seg; e[seg] = (String(e[seg])===sb.dataset.v && seg!=='ageUnit') ? '' : sb.dataset.v; if(seg==='urgency') e.emerg = e.urgency==='Emergency'; $$('button',sb.parentElement).forEach(b=>b.classList.toggle('on', b.dataset.v===String(e[seg]))); }
  });
  const save = (again) => {
    if(!e.proc){ toast('Select a procedure'); return false; }
    if(!e.date){ toast('Set a date'); return false; }
    e.updatedAt = nowIso(); if(!e.createdAt) e.createdAt = e.updatedAt;
    const i = S.entries.findIndex(x=>x.id===e.id);
    if(i>=0) S.entries[i]=e; else S.entries.push(e);
    LS.set('lastEntryDefaults', {cat:e.cat, sup:e.sup});

    toast(existing?'Entry updated':'Entry saved');
    close();
    if(again){ const nx = {cat:e.cat, sup:e.sup}; LS.set('lastEntryDefaults', nx); openEntry(null); }
    if(location.hash.startsWith('#log')||location.hash.startsWith('#dash')) route();
    return true;
  };
  $('[data-save]',bg).onclick = ()=>save(false);
  const sa=$('[data-saveadd]',bg); if(sa) sa.onclick=()=>save(true);
  const del=$('[data-del]',bg); if(del) del.onclick=()=>{
    if(!confirmInline(del)) return;
    const i=S.entries.findIndex(x=>x.id===e.id);
    if(i>=0){ S.entries[i] = {id:e.id, deleted:true, updatedAt:nowIso(), createdAt:S.entries[i].createdAt}; saveEntries(); }
    toast('Entry deleted'); close(); route();
  };
}
/* two-tap confirm (avoids blocking browser dialogs) */
function confirmInline(btn){
  if(btn.dataset.armed){ return true; }
  btn.dataset.armed='1'; const old=btn.textContent; btn.textContent='Tap again to confirm';
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=old; } }, 3000);
  return false;
}

function rangeStart(r){
  const d=new Date(); d.setHours(0,0,0,0);
  if(r==='30d'){ d.setDate(d.getDate()-29); }
  else if(r==='3m'){ d.setMonth(d.getMonth()-2,1); }
  else if(r==='6m'){ d.setMonth(d.getMonth()-5,1); }
  else if(r==='12m'){ d.setMonth(d.getMonth()-11,1); }
  else return null;
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function monthKeys(fromKey, toKey){
  const out=[]; let [y,m]=fromKey.split('-').map(Number); const [ty,tm]=toKey.split('-').map(Number);
  while(y<ty || (y===ty && m<=tm)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} if(out.length>240) break; }
  return out;
}

  const ussElig = inR.filter(e=>e.cat==='block'||e.cat==='vascular');
  const ussPct = ussElig.length ? Math.round(100*ussElig.filter(e=>e.uss).length/ussElig.length) : null;
  const ranges=[['30d','30 days'],['3m','3 months'],['6m','6 months'],['12m','12 months'],['all','All time']];
  m.innerHTML = `

    <div class="chips" id="drange" style="margin-bottom:14px">${ranges.map(([k,l])=>`<button class="chip ${r===k?'on':''}" data-r="${k}">${l}</button>`).join('')}</div>
    ${all.length? '' : '<div class="notice info" style="margin-bottom:14px">No entries yet — log procedures in the Log tab and they will appear here.</div>'}
    <div class="kpis">

      <div class="card kpi"><div class="k">Success rate</div><div class="v">${withOutcome.length?Math.round(100*succ/withOutcome.length)+'%':'–'}</div><div class="s">${succ}/${withOutcome.length} with outcome</div></div>
      <div class="card kpi"><div class="k">USS-guided</div><div class="v">${ussPct==null?'–':ussPct+'%'}</div><div class="s">blocks + vascular</div></div>

    <div class="dash-grid">

      <div class="card pad"><h2>Supervision level</h2><div id="suptot"></div></div>
      <div class="card pad wide"><div class="row"><h2 style="margin:0">Trend over time</h2><span class="spacer"></span><button class="btn sm" id="tbltog">${S.ui.showTable?'Hide table':'Show table'}</button></div>
        <div class="legend" id="trlegend"></div><div class="chart-wrap" id="trend"></div><div id="trtable"></div></div>
      <div class="card pad wide"><h2>Breakdown</h2><div class="chips" id="bdcats" style="margin-bottom:10px"></div><div id="bd"></div></div>

  $('#drange').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; S.ui.dashRange=b.dataset.r; renderDash(m); };

  if(unset) supC.push({s:'Not recorded', n:unset});
  const maxS = Math.max(1,...supC.map(x=>x.n));
  $('#suptot').innerHTML = supC.map(({s,n})=>`<div class="hbar" title="${esc(s)}: ${n}"><div class="lab">${esc(s)}</div><div class="track"><div class="fill" style="width:${100*n/maxS}%;background:var(--s1)"></div></div><div class="cnt">${n}</div></div>`).join('');

  // trend

  $('#bdcats').innerHTML = CATS.map(c=>`<button class="chip ${S.ui.dashCat===c.id?'on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');

  const rows = Object.entries(map).sort((a,b)=>b[1].n-a[1].n);
  const maxB = Math.max(1,...rows.map(r=>r[1].n));
  const col = CAT[S.ui.dashCat].color;
  $('#bd').innerHTML = rows.length ? rows.map(([k,v])=>`<div class="hbar" title="${esc(k)}: ${v.n}${v.o?` · ${Math.round(100*v.s/v.o)}% success`:''}"><div class="lab">${esc(k)}</div><div class="track"><div class="fill" style="width:${100*v.n/maxB}%;background:${col}"></div></div><div class="cnt">${v.n}</div></div>`).join('')
    + `<div class="tbl-scroll" style="margin-top:12px"><table class="data"><thead><tr><th>Procedure</th><th>Total</th><th>Success</th><th>USS</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.o?Math.round(100*v.s/v.o)+'%':'–'}</td><td>${v.u}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="faint small">No entries in this category for the selected range.</div>';
  if(S.ui.dashCat==='airway' && sub.length){
    const lc={}; sub.forEach(e=>{ if(e.laryngo) lc[e.laryngo]=(lc[e.laryngo]||0)+1; });
    const ents=Object.entries(lc); if(ents.length) $('#bd').innerHTML += `<h3>Laryngoscopy</h3>`+ents.sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="kv"><span>${esc(k)}</span><b class="num">${n}</b></div>`).join('');
  }
}
function drawTrend(all, start){
  const host = $('#trend');
  const today = todayStr().slice(0,7);
  let fromKey;
  if(start) fromKey = start.slice(0,7);
  else { const ds = all.map(e=>e.date).filter(Boolean).sort(); fromKey = ds.length ? ds[0].slice(0,7) : today; }
  let keys = monthKeys(fromKey, today);
  let bucket = k => k, labelOf = k => { const [y,mo]=k.split('-'); return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:'short'}); };
  if(S.ui.dashRange==='30d'){ // daily buckets would be noisy: use weeks
    const s=new Date(start); keys=[]; for(let i=0;i<5;i++){ const d=new Date(s.getTime()+i*7*864e5); keys.push(d.toISOString().slice(0,10)); }
    bucket = date => { const idx=Math.min(4,Math.floor((new Date(date)-new Date(start))/(7*864e5))); return keys[idx]; };
    labelOf = k => new Date(k).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  } else if(keys.length>24){
    const q = k => { const [y,mo]=k.split('-').map(Number); return y+'-Q'+(Math.floor((mo-1)/3)+1); };
    keys = Array.from(new Set(keys.map(q))); bucket = date => q(date.slice(0,7)); labelOf = k => k.replace('-',' ');
  }
  const useMonth = S.ui.dashRange!=='30d' && !(keys[0]&&keys[0].includes('Q'));
  const data = keys.map(k=>({k, by:Object.fromEntries(CATS.map(c=>[c.id,0])), t:0}));
  const idx = Object.fromEntries(keys.map((k,i)=>[k,i]));
  all.forEach(e=>{ if(!e.date) return; if(start && e.date<start) return; const b = useMonth ? e.date.slice(0,7) : bucket(e.date); const i=idx[b]; if(i==null) return; data[i].by[e.cat]=(data[i].by[e.cat]||0)+1; data[i].t++; });
  const present = CATS.filter(c=>data.some(d=>d.by[c.id]>0));
  $('#trlegend').innerHTML = present.length ? present.map(c=>`<span><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</span>`).join('') : '';
  const W = Math.max(320, host.clientWidth||640), H = 220, padL=30, padR=8, padT=10, padB=26;
  const maxT = Math.max(1, ...data.map(d=>d.t));
  const rawStep = maxT/4, mag = Math.pow(10, Math.floor(Math.log10(Math.max(1,rawStep))));
  const step = Math.max(1, [1,2,5,10].map(x=>x*mag).find(x=>x>=rawStep) || 10*mag);
  const nice = step*4;
  const iw = W-padL-padR, ih = H-padT-padB, n=data.length;
  const slot = iw/n, bw = Math.max(4, Math.min(36, slot*0.62));
  const y = v => padT + ih - (v/nice)*ih;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Procedures per period, stacked by category"><g class="grid">`;
  const ticks = 4; for(let i=0;i<=ticks;i++){ const v=nice*i/ticks; svg+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/>`; }
  svg += '</g><g class="axis">';
  for(let i=0;i<=ticks;i++){ const v=nice*i/ticks; svg+=`<text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const every = Math.ceil(n/ (W<500?6:12));
  data.forEach((d,i)=>{ if(i%every===0||i===n-1) svg+=`<text x="${padL+slot*i+slot/2}" y="${H-8}" text-anchor="middle">${esc(labelOf(d.k))}</text>`; });
  svg += '</g><g>';
  data.forEach((d,i)=>{
    const x = padL+slot*i+(slot-bw)/2; let acc=0;
    const segs = present.filter(c=>d.by[c.id]>0);
    segs.forEach((c,si)=>{
      const v=d.by[c.id]; const y1=y(acc+v), y0=y(acc); acc+=v;
      const gap = si<segs.length-1 ? 0 : 0;
      const h = Math.max(0, y0-y1-(si>0?2:0));
      const top = si===segs.length-1;
      if(top && h>4){ const r=Math.min(4,bw/2); svg+=`<path d="M${x},${y1+h+(si>0?0:0)} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+bw-r} Q${x+bw},${y1} ${x+bw},${y1+r} V${y1+h} Z" fill="${c.color}"/>`; }
      else svg+=`<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${c.color}"/>`;
      void gap;
    });
    svg+=`<rect class="hit" data-i="${i}" x="${padL+slot*i}" y="${padT}" width="${slot}" height="${ih}" fill="transparent"/>`;
  });
  svg += '</g></svg>';
  host.innerHTML = svg + '<div class="tip" style="display:none"></div>';
  const tip = $('.tip',host);
  const show = (i, cx) => {
    const d=data[i]; if(!d) return;
    tip.innerHTML = `<div class="tt">${esc(useMonth?monthLabel(d.k):labelOf(d.k))} · ${d.t}</div>` + (d.t? present.filter(c=>d.by[c.id]).map(c=>`<div class="tr"><span><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</span><b class="num">${d.by[c.id]}</b></div>`).join('') : '<div class="faint">No entries</div>');
    tip.style.display='block';
    const hostW = host.clientWidth; const tw = tip.offsetWidth;
    let left = cx + 12; if(left+tw>hostW) left = cx - tw - 12; if(left<0) left=0;
    tip.style.left=left+'px'; tip.style.top='8px';
  };
  host.querySelectorAll('.hit').forEach(r=>{
    const handler = ev => { const box=host.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-box.left; show(+r.dataset.i, cx); };
    r.addEventListener('mousemove', handler); r.addEventListener('touchstart', handler, {passive:true});
  });
  host.addEventListener('mouseleave', ()=>tip.style.display='none');
  if(S.ui.showTable){
    $('#trtable').innerHTML = `<div class="tbl-scroll" style="margin-top:10px"><table class="data"><thead><tr><th>Period</th>${CATS.map(c=>`<th>${esc(c.name)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(useMonth?monthLabel(d.k):labelOf(d.k))}</td>${CATS.map(c=>`<td>${d.by[c.id]||0}</td>`).join('')}<td><b>${d.t}</b></td></tr>`).join('')}</tbody></table></div>`;
  }
}

    <div class="row">
      <button class="btn" id="b-json">Export backup (JSON)</button>
      <button class="btn" id="b-csv">Export log (CSV)</button>
      <label class="btn" style="cursor:pointer">Import backup<input type="file" id="b-imp" accept="application/json,.json" style="display:none"></label>
    </div>
    <div class="tiny faint" style="margin-top:8px">Import merges with existing data (newest edit wins) — it never wipes entries.</div>
  </div>
  <div class="card pad set-sec">
    <h2>Data</h2>
    <div class="kv"><span>Log entries</span><b class="num">${live().length}</b></div>
    <div class="kv"><span>Drugs verified by you</span><b class="num">${verifiedCount()} / ${DRUGS.length}</b></div>
    <div class="kv"><span>App version</span><b>${APP_VERSION}</b></div>
    <div class="kv"><span>Offline ready</span><b id="offl">${'serviceWorker' in navigator && navigator.serviceWorker.controller ? 'Yes' : 'Not yet (open once online, then reload)'}</b></div>
    <div class="row" style="margin-top:12px"><button class="btn danger" id="b-wipe">Erase data on this device</button></div>
  </div>
  <div class="card pad set-sec small muted">
    <b>Drug reference disclaimer.</b> The drug data is an AI-compiled draft based on standard references and named guidelines (ASRA LAST 2020, AAGBI MH 2020/EMHG 2024, RCUK anaphylaxis 2021/2024, 4th PONV consensus 2020, and others listed per drug). Doses, concentrations and licensing vary by country and institution. Verify each entry against your local formulary before relying on it, and use “Mark verified” to track what you have checked.
  </div>`;
  $('#s-save').onclick = ()=>{
    S.settings = {owner:$('#s-owner').value.trim(), repo:$('#s-repo').value.trim(), token:$('#s-token').value.trim(), path:$('#s-path').value.trim()||'anaes-kit-data.json', auto:$('#s-auto').checked};
    LS.set('settings', S.settings); doSync(true);
  };
  $('#b-json').onclick = ()=>download('anaes-kit-backup-'+todayStr()+'.json', JSON.stringify(payload(),null,1), 'application/json');
  $('#b-csv').onclick = ()=>download('anaes-kit-log-'+todayStr()+'.csv', toCsv(), 'text/csv');
  $('#b-imp').onchange = async ev=>{
    const f=ev.target.files[0]; if(!f) return;
    try{ const obj=JSON.parse(await f.text()); const before=live().length; mergeInto(obj); LS.set('entries',S.entries); LS.set('drugmeta',S.drugmeta); scheduleSync(); toast('Imported — '+(live().length-before)+' new entries'); route(); }
    catch(e){ toast('Import failed: not a valid backup'); }
  };
  $('#b-wipe').onclick = ev=>{ if(!confirmInline(ev.currentTarget)) return; ['entries','drugmeta','sync','lastEntryDefaults'].forEach(k=>localStorage.removeItem('ak.'+k)); S.entries=[]; S.drugmeta={}; S.sync={lastSync:null,status:'off',msg:''}; toast('Local data erased (synced copy untouched)'); route(); };
}
function download(name, text, type){
  const blob = new Blob([text], {type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}
function toCsv(){
  const cols = [['date','Date'],['cat','Category'],['proc','Procedure'],['site','Site'],['side','Side'],['uss','USS'],['ns','Nerve stim'],['catheter','Catheter'],['device','Device/details'],['laryngo','Laryngoscopy'],['cl','CL grade'],['adj','Adjuncts'],['level','Level'],['needle','Needle'],['approach','Approach'],['lor','LOR'],['la','LA/volume'],['drug','Drug/dose'],['ageVal','Age'],['ageUnit','Age unit'],['sex','Sex'],['asa','ASA'],['urgency','Urgency'],['specialty','Specialty'],['history','Pertinent history'],['sup','Supervision'],['attempts','Attempts'],['outcome','Outcome'],['complications','Complications'],['compOther','Other complication'],['notes','Notes']];
  const q = v => { if(v==null) v=''; if(Array.isArray(v)) v=v.join('; '); if(typeof v==='boolean') v=v?'Y':''; if(cols && v===undefined) v=''; v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = live().slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return [cols.map(c=>c[1]).join(',')].concat(rows.map(e=>cols.map(([k])=> k==='cat' ? q(CAT[e.cat]?CAT[e.cat].name:e.cat) : q(e[k])).join(','))).join('\n');
}

/* =====================================================
   SYNC (GitHub contents API, private repo)
   ===================================================== */
function payload(){ return {app:'anaes-kit', version:1, exportedAt:nowIso(), entries:S.entries, drugmeta:S.drugmeta}; }
function mergeInto(remote){
  let changed=false;
  if(remote && Array.isArray(remote.entries)){
    const map = new Map(S.entries.map(e=>[e.id,e]));
    for(const r of remote.entries){ if(!r||!r.id) continue; const l=map.get(r.id); if(!l || (r.updatedAt||'')>(l.updatedAt||'')){ map.set(r.id,r); changed=true; } }
    S.entries = Array.from(map.values());
  }
  if(remote && remote.drugmeta && typeof remote.drugmeta==='object'){
    for(const [id,r] of Object.entries(remote.drugmeta)){ const l=S.drugmeta[id]; if(!l || (r.updatedAt||'')>(l.updatedAt||'')){ S.drugmeta[id]=r; changed=true; } }
  }
  return changed;
}
const b64enc = str => { const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); };
const b64dec = b64 => { const bin=atob(b64.replace(/\s/g,'')); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); };
function syncConfigured(){ const s=S.settings; return !!(s.owner&&s.repo&&s.token); }
function setSync(status,msg){ S.sync.status=status; S.sync.msg=msg||''; if(status==='ok') S.sync.lastSync=nowIso(); LS.set('sync',S.sync); renderSyncPill(); const el=$('#s-status'); if(el) el.textContent=syncLabel(); }
function syncLabel(){
  const s=S.sync;
  if(!syncConfigured()) return 'Not set up';
  if(s.status==='busy') return 'Syncing…';
  if(s.status==='err') return 'Sync error: '+s.msg;
  if(s.status==='offline') return 'Offline — will sync later';
  if(s.lastSync) return 'Synced '+timeAgo(s.lastSync);
  return 'Ready';
}
function timeAgo(iso){ const d=(Date.now()-new Date(iso))/1000; if(d<60) return 'just now'; if(d<3600) return Math.floor(d/60)+' min ago'; if(d<86400) return Math.floor(d/3600)+' h ago'; return new Date(iso).toLocaleDateString(); }
function renderSyncPill(){
  const p=$('#syncpill'); if(!p) return;
  const s=S.sync; let cls='', txt;
  if(!syncConfigured()){ txt='Local only'; }
  else if(s.status==='busy'){ cls='busy'; txt='Syncing'; }
  else if(s.status==='err'){ cls='err'; txt='Sync error'; }
  else if(s.status==='offline'||!navigator.onLine){ txt='Offline'; }
  else { cls='ok'; txt = s.lastSync ? 'Synced' : 'Ready'; }
  p.innerHTML = `<span class="dot ${cls}"></span>${txt}`;
  p.title = syncLabel();
}
let syncTimer=null, syncing=false, syncAgain=false;
function scheduleSync(){ if(!syncConfigured()||!S.settings.auto) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>doSync(false), 2500); }
async function gh(method, body){
  const s=S.settings; const url=`https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/contents/${s.path.split('/').map(encodeURIComponent).join('/')}`;
  const res = await fetch(url, {method, cache:'no-store', headers:{'Authorization':'Bearer '+s.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28', ...(body?{'Content-Type':'application/json'}:{})}, body: body?JSON.stringify(body):undefined});
  return res;
}
async function doSync(manual){
  if(!syncConfigured()){ if(manual) toast('Fill in username, repo and token'); return; }
  if(!navigator.onLine){ setSync('offline'); if(manual) toast('Offline — will sync when online'); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; setSync('busy');
  try{
    for(let attempt=0; attempt<3; attempt++){
      let sha=null, remote=null;
      const r = await gh('GET');
      if(r.status===200){ const j=await r.json(); sha=j.sha; let txt=j.content?b64dec(j.content):'';
        if(!txt && j.download_url){ const rr=await fetch(j.download_url,{cache:'no-store',headers:{'Authorization':'Bearer '+S.settings.token}}); txt=await rr.text(); }
        try{ remote = txt?JSON.parse(txt):null; }catch(e){ throw new Error('remote file is not valid JSON'); } }
      else if(r.status===404){ remote=null; }
      else if(r.status===401) throw new Error('token rejected (401)');
      else if(r.status===403) throw new Error('no permission (403) — check token repo access');
      else throw new Error('GitHub '+r.status);
      const localBefore = JSON.stringify({e:S.entries,m:S.drugmeta});
      if(remote) mergeInto(remote);
      LS.set('entries',S.entries); LS.set('drugmeta',S.drugmeta);
      const merged = {e:S.entries,m:S.drugmeta};
      const remoteSame = remote && JSON.stringify({e:sortById(remote.entries||[]),m:remote.drugmeta||{}})===JSON.stringify({e:sortById(merged.e),m:merged.m});
      if(!remoteSame){
        const body = {message:'Anaes Kit sync '+nowIso(), content:b64enc(JSON.stringify(payload())), ...(sha?{sha}:{})};
        const p = await gh('PUT', body);
        if(p.status===409||p.status===422){ continue; } // file changed underneath — retry merge
        if(p.status===404) throw new Error('repo not found — check username/repo and token access');
        if(!p.ok) throw new Error('GitHub write '+p.status);
      }
      setSync('ok');
      if(localBefore!==JSON.stringify({e:S.entries,m:S.drugmeta})){ const h=location.hash; if(!document.querySelector('.sheet-bg') && (h.startsWith('#log')||h.startsWith('#dash')||h===''||h.startsWith('#drug'))) route(); }
      if(manual) toast('Synced');
      break;
    }
  }catch(err){ setSync(navigator.onLine?'err':'offline', String(err.message||err)); if(manual) toast('Sync failed: '+(err.message||err)); }
  finally{ syncing=false; if(syncAgain){ syncAgain=false; scheduleSync(); } }
}
function sortById(arr){ return arr.slice().sort((a,b)=>(a.id||'').localeCompare(b.id||'')); }
window.addEventListener('online', ()=>{ renderSyncPill(); scheduleSync(); });
window.addEventListener('offline', ()=>{ renderSyncPill(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && syncConfigured() && S.settings.auto) doSync(false); });

/* ---------------- boot ---------------- */
function boot(){
  let framed=false; try{ framed = window.self!==window.top; }catch(e){ framed=true; }
  if(framed){ const n=document.createElement('div'); n.className='notice'; n.style.cssText='margin:10px 16px 0;'; n.innerHTML='<span>⚠</span><span><b>Preview only.</b> Sync, export and offline mode are blocked inside this preview. Install the GitHub Pages version (see setup guide) for real use — data entered here stays here.</span>'; document.querySelector('.topbar').after(n); }
  $('#syncpill').onclick = ()=>{ if(syncConfigured()) doSync(true); else location.hash='#settings'; };
  route();
  if(syncConfigured() && S.settings.auto) setTimeout(()=>doSync(false), 600);
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
// expose for tests
window.__AK = {S, scalars, calcHtml, mergeInto, searchDrugs, toCsv, payload, b64enc, b64dec};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
